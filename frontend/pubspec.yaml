name: guide_scolaire
description: Guide Scolaire Comores
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ Services et état
  provider: ^6.1.2
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # ✅ Localisation
  flutter_localizations:  
    sdk: flutter
  intl: ^0.20.2  # ✅ CHANGER de 0.19.0 à 0.20.2
  
  # ✅ Stockage local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # ✅ UI et composants
  equatable: ^2.0.5
  flutter_markdown: ^0.6.18+2
  highlight: ^0.7.0
  flutter_svg: ^2.0.10+1
  
  # ✅ Fichiers et médias
  file_picker: ^6.1.1  
  image_picker: ^1.0.4 
  url_launcher: ^6.2.1
  
  # ✅ Firebase (optionnel)
  firebase_storage: ^11.7.7
  firebase_core: ^2.32.0
  
  # ✅ Utilitaires
  clipboard: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.3
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.svg
    - assets/images/favicon.svg
    - assets/l10n/
    - assets/l10n/fr.json
    - assets/l10n/en.json
    - assets/l10n/es.json
    - assets/l10n/ar.json

